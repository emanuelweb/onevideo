# OneVideo — Configuración de MediaMTX (MVP: solo WebRTC)
# Referencia de claves: https://github.com/bluenviron/mediamtx

logLevel: info

###############################################
# Autenticación delegada al backend
###############################################

# Cada intento de publish/read/api se valida con un POST JSON al API de OneVideo.
authMethod: http
# En docker-compose este valor se sobrescribe con la variable de entorno
# MTX_AUTHHTTPADDRESS=http://api:8000/api/v1/internal/mediamtx/auth?secret=${MEDIAMTX_AUTH_SECRET}:
# el secreto compartido autentica a MediaMTX ante el API (la IP del cliente no basta,
# porque X-Forwarded-For es falsificable a través del reverse proxy).
authHTTPAddress: http://api:8000/api/v1/internal/mediamtx/auth
# Sin exclusiones: el API también decide sobre "action: api"
# (lo permite solo desde IPs de la red interna de Docker).
authHTTPExclude: []

###############################################
# API de control de MediaMTX
###############################################

# La consume el tracker de sesiones del backend (GET /v3/paths/list cada 30 s).
# Solo accesible dentro de la red Docker; no publicar este puerto al host.
api: yes
apiAddress: :9997

###############################################
# Protocolos deshabilitados en el MVP
###############################################

rtsp: no
rtmp: no
hls: no
srt: no

###############################################
# WebRTC (WHIP para publicar, WHEP y player para leer)
###############################################

webrtc: yes
webrtcAddress: :8889
# TLS lo termina el reverse proxy (Traefik/Dokploy); el tráfico interno va en claro.
webrtcEncryption: no
webrtcAllowOrigin: '*'
# Puerto UDP único para ICE. Debe publicarse 8189/udp en el host
# y abrirse en el firewall del VPS.
webrtcLocalUDPAddress: :8189
# NO anunciar las IPs de las interfaces del contenedor: dentro de Docker son
# direcciones privadas (172.x / 10.x) inalcanzables desde internet. Si se anuncian,
# encabezan la lista de candidatos ICE y los clientes WebRTC minimalistas —como el
# publicador WHIP de FFmpeg o algunas implementaciones móviles— intentan solo el
# primero y fallan con "connection refused" sin llegar a probar la IP pública.
webrtcIPsFromInterfaces: no
# Único host anunciado en los candidatos ICE: la IP pública del VPS.
# docker-compose lo sobrescribe con MTX_WEBRTCADDITIONALHOSTS=${PUBLIC_IP},
# por eso PUBLIC_IP es obligatoria: sin ella no habría ningún candidato válido.
webrtcAdditionalHosts: [203.0.113.10]

###############################################
# Grabación en la nube (defaults de todos los paths)
###############################################

# Claves verificadas contra la doc oficial (mediamtx.yml de referencia y
# api/openapi.yaml del repo bluenviron/mediamtx). Aplican a todo path, incluidos
# los path configs que el backend agrega en runtime por la API de control (:9997):
#   - Activar:    POST   /v3/config/paths/add/live%2F<device_uuid>   {"record": true}
#   - Ya existe:  PATCH  /v3/config/paths/patch/live%2F<device_uuid> {"record": true}
#   - Desactivar: DELETE /v3/config/paths/delete/live%2F<device_uuid>
# (el nombre del path va URL-encodeado: la barra como %2F).
pathDefaults:
  # Apagada por defecto; se enciende por dispositivo vía la API de control.
  record: no
  # Los archivos quedan en /recordings/live/<device_uuid>/<YYYY-MM-DD_HH-MM-SS-ffffff>.mp4
  # (volumen recordings-data de docker-compose, compartido con el servicio api).
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 1h
  # IMPORTANTE: el default de MediaMTX es 1d y borraría las grabaciones solo.
  # 0s = no borrar nunca; la limpieza la hace el usuario desde el dashboard.
  recordDeleteAfter: 0s

###############################################
# Paths
###############################################

# Solo se aceptan paths con la forma live/<uuid en minúsculas y con guiones>.
# Cualquier otro path se rechaza (no hay comodín). Los path configs explícitos
# `live/<uuid>` que agrega el backend para grabar tienen prioridad sobre este
# regex y heredan el resto de valores de pathDefaults.
paths:
  '~^live/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$':
    source: publisher
